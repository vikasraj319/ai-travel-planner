<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Horizons AI — AI-Powered Travel Planner</title>
    <meta name="description" content="Plan your perfect trip with Horizons AI. Get AI-generated personalized itineraries, interactive route maps, destination insights, and restaurant recommendations in seconds." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Vikas Raj" />
    <link rel="canonical" href="https://ai-travel-planner-gamma-sooty.vercel.app/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ai-travel-planner-gamma-sooty.vercel.app/" />
    <meta property="og:title" content="Horizons AI — AI-Powered Travel Planner" />
    <meta property="og:description" content="Generate personalized travel itineraries, optimized routes, and destination insights with AI in seconds." />
    <meta property="og:image" content="https://ai-travel-planner-gamma-sooty.vercel.app/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Horizons AI — AI-Powered Travel Planner" />
    <meta name="twitter:description" content="Generate personalized travel itineraries, optimized routes, and destination insights with AI in seconds." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("horizons-theme");
          var dark = stored === "dark" || (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
